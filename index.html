<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DolarHoy - Precio del Dólar en Venezuela</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💱</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-icon {
            font-size: 32px;
            display: flex;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .currency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px;
        }
        
        .currency-card {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .currency-card:hover {
            transform: translateY(-5px);
        }
        
        .currency-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .currency-price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .currency-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        .positive {
            color: #2ecc71;
        }
        
        .negative {
            color: #e74c3c;
        }
        
        .last-update {
            text-align: center;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin: 25px;
            font-size: 14px;
            color: #6c757d;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #6c757d;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            background-color: #fadbd8;
            border-radius: 8px;
            margin: 25px;
            display: none;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .auto-update {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info {
            margin: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #6c757d;
            text-align: center;
        }
        
        .info a {
            color: #3498db;
            text-decoration: none;
        }
        
        .info a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .currency-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            header {
                flex-direction: column;
                gap: 10px;
            }
            
            .header-title {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        .flag {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <div class="header-icon">💱</div>
                <div>
                    <h1>DolarHoy</h1>
                    <p class="subtitle">Cotizaciones actualizadas del mercado paralelo</p>
                </div>
                <div class="header-icon">💰</div>
            </div>
        </header>
        
        <div class="error" id="error-message">
            Error al cargar los datos. Por favor, intente nuevamente.
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Cargando cotizaciones...
        </div>
        
        <div class="currency-grid" id="currency-container">
            <!-- Los datos se cargarán aquí -->
        </div>
        
        <div class="last-update">
            <p>Última actualización: <span id="update-time">-</span></p>
        </div>
        
        <div class="controls">
            <button class="btn" id="btn-update">
                <i class="fas fa-sync-alt"></i> Actualizar ahora
            </button>
            <div class="auto-update">
                <input type="checkbox" id="auto-update" checked>
                <label for="auto-update">Actualizar automáticamente cada 5 minutos</label>
            </div>
        </div>
        
        <div class="info">
            <p>Datos proporcionados por <a href="https://dolarapi.com/" target="_blank">DolarAPI</a>. 
            Las cotizaciones se actualizan periódicamente según la disponibilidad de la fuente.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currencyContainer = document.getElementById('currency-container');
            const updateTimeElement = document.getElementById('update-time');
            const errorMessage = document.getElementById('error-message');
            const loadingElement = document.getElementById('loading');
            const btnUpdate = document.getElementById('btn-update');
            const autoUpdateCheckbox = document.getElementById('auto-update');
            
            let updateInterval;
            
            // Formatear número con separadores de miles y decimales
            function formatNumber(number) {
                return new Intl.NumberFormat('es-VE', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(number);
            }
            
            // Obtener la fecha y hora actual formateada
            function getCurrentDateTime() {
                return new Date().toLocaleString('es-VE');
            }
            
            // Función para obtener los datos de la API
            async function fetchDollarData() {
                try {
                    loadingElement.style.display = 'block';
                    currencyContainer.innerHTML = '';
                    
                    const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                    
                    if (!response.ok) {
                        throw new Error('Error en la respuesta de la API');
                    }
                    
                    const data = await response.json();
                    
                    // Ocultar mensaje de error si está visible
                    errorMessage.style.display = 'none';
                    
                    // Mostrar los datos
                    displayData(data);
                    
                    // Actualizar la hora de la última actualización
                    updateTimeElement.textContent = getCurrentDateTime();
                    
                } catch (error) {
                    console.error('Error al obtener los datos:', error);
                    errorMessage.style.display = 'block';
                } finally {
                    loadingElement.style.display = 'none';
                }
            }
            
            // Función para mostrar los datos en el HTML
            function displayData(data) {
                // Crear tarjetas para cada tipo de dólar
                data.forEach(currency => {
                    const card = document.createElement('div');
                    card.className = 'currency-card';
                    
                    // Determinar tendencia (aumento o disminución)
                    const changeClass = currency.monitor && currency.monitor.brecha ? 
                                        (parseFloat(currency.monitor.brecha) >= 0 ? 'positive' : 'negative') : '';
                    
                    const changeSymbol = currency.monitor && currency.monitor.brecha ? 
                                        (parseFloat(currency.monitor.brecha) >= 0 ? '↗' : '↘') : '';
                    
                    card.innerHTML = `
                        <div class="currency-name">
                            <span>${currency.nombre}</span>
                        </div>
                        <div class="currency-price">
                            Bs. ${formatNumber(currency.promedio || currency.venta)}
                        </div>
                        <div class="currency-details">
                            <span>Compra:</span>
                            <span>Bs. ${formatNumber(currency.compra)}</span>
                        </div>
                        <div class="currency-details">
                            <span>Venta:</span>
                            <span>Bs. ${formatNumber(currency.venta)}</span>
                        </div>
                        ${currency.monitor && currency.monitor.brecha ? `
                        <div class="currency-details ${changeClass}">
                            <span>Brecha:</span>
                            <span>${formatNumber(currency.monitor.brecha)}% ${changeSymbol}</span>
                        </div>
                        ` : ''}
                    `;
                    
                    currencyContainer.appendChild(card);
                });
            }
            
            // Configurar la actualización automática
            function setupAutoUpdate() {
                if (autoUpdateCheckbox.checked) {
                    updateInterval = setInterval(fetchDollarData, 5 * 60 * 1000); // 5 minutos
                } else {
                    clearInterval(updateInterval);
                }
            }
            
            // Event listeners
            btnUpdate.addEventListener('click', fetchDollarData);
            autoUpdateCheckbox.addEventListener('change', setupAutoUpdate);
            
            // Inicializar
            fetchDollarData();
            setupAutoUpdate();
        });
    </script>
</body>
</html>
